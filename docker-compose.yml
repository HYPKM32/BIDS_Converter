networks:
  bids_network:
volumes:
  defacing-defacer_shared:
  defacing-medfacer_shared:
  canonical_shared:
  T1w_preprocessing-civet_shared:

services:
  bids:
    build:
      context: ./bids
      dockerfile: Dockerfile
    container_name: bids
    volumes:
      - /nasdata3/BDSP:/BDSP/interfaces/working
      - ./bids:/BDSP/bids_app
      - /nasdata4/parknm/bids:/BDSP/data
      - defacing-defacer_shared:/BDSP/interfaces/flag/defacing/defacer
      - canonical_shared:/BDSP/interfaces/flag/canonical/canonical

    stdin_open: true 
    tty: true           
    command: /bin/bash
    
  defacing-defacer:
    build:
      context: ./defacing-defacer
      dockerfile: Dockerfile
    container_name: defacing-defacer
    volumes:
      - /nasdata3/BDSP:/BDSP/interfaces/working
      - ./defacing-defacer:/BDSP/defacer_app
      - defacing-defacer_shared:/BDSP/interfaces/event

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['1']
    stdin_open: true 
    tty: true   
    command: /bin/bash
    
  canonical-canonical:
    build:
      context: ./canonical
      dockerfile: Dockerfile
    container_name: canonical-canonical
    volumes:
      - /nasdata3/BDSP:/BDSP/interfaces/working
      - ./canonical:/BDSP/canonical_app
      - canonical_shared:/BDSP/interfaces/event
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['1']
    stdin_open: true 
    tty: true   
    command: /bin/bash