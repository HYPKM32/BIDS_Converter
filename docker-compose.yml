volumes:
  defacing-defacer_flag:
  defacing-medfacer_flag:
  canonical_flag:
  T1wPreprocess-civet_flag:
  T1wPreprocess-freesurfer_flag:

###############################################################################
services:

  bids:
    build:
      context: ./bids
      dockerfile: Dockerfile
    container_name: bids
    volumes:
      - /nasdata3/BDSP:/BDSP/interfaces/working
      - ./bids:/BDSP/bids_app
      - /nasdata4/parknm/bids:/BDSP/data
      - defacing-defacer_flag:/BDSP/interfaces/flag/defacing/defacer
      - canonical_flag:/BDSP/interfaces/flag/canonical/canonical
      - T1wPreprocess-civet_flag:/BDSP/interfaces/flag/T1wPreprocess/civet
    ports:
      - "210.117.210.9:8896:8896"
    dns:
      - 8.8.8.8
    environment: 
      - HOST=210.117.210.9
      - PORT=8896
    stdin_open: true 
    tty: true           
    command: ["python3","/BDSP/bids_app/src/app.py"]
###############################################################################
  defacing-defacer:
    build:
      context: ./defacing-defacer
      dockerfile: Dockerfile
    container_name: defacing-defacer
    volumes:
      - /nasdata3/BDSP:/BDSP/interfaces/working
      - ./defacing-defacer:/BDSP/defacer_app
      - defacing-defacer_flag:/BDSP/interfaces/event
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['1']
    stdin_open: true 
    tty: true   
    command: ["python3","/BDSP/defacer_app/src/app.py"]
###############################################################################
  canonical:
    build:
      context: ./canonical
      dockerfile: Dockerfile
    container_name: canonical
    volumes:
      - /nasdata3/BDSP:/BDSP/interfaces/working
      - ./canonical:/BDSP/canonical_app
      - canonical_flag:/BDSP/interfaces/event
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['1']
    stdin_open: true 
    tty: true   
    command: ["python3","/BDSP/canonical_app/src/app.py"]
###############################################################################
  civet:
    build: 
      context: ./civet
      dockerfile: Dockerfile
    container_name: T1wPreprocess-civet
    volumes: 
      - /nasdata3/BDSP:/BDSP/interfaces/working
      - ./civet:/BDSP/civet_app
      - T1wPreprocess-civet_flag:/BDSP/interfaces/event 
    environment: 
      - LANG=en_US.UTF-8
    stdin_open: true
    tty: true
    command: ["python3","/BDSP/civet_app/src/app.py"]
    ulimits:
      stack: -1